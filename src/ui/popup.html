<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Obsidian Translate</title>
  <link rel="icon" href="icons/32.png">
  <style>
    body { margin: 0; padding: 0; background: #fff; width: max-content; }
    .ot-panel .ot-main, .ot-panel .ot-details { box-shadow: none; }
    .ot-panel { align-items: stretch; gap: 0; flex-direction: row; }
    .ot-panel .ot-details { flex: none; max-width: none; width: 224px; max-height: none; }
    .ot-panel .ot-main { max-width: none; }
    body:has(.ot-expanded) { width: 500px; }
    @media (pointer: coarse) {
      body:has(.ot-expanded) { width: 276px; }
      .ot-panel { flex-direction: column; }
      .ot-panel .ot-details { width: 276px; }
    }
    body.demo-popup:has(.ot-expanded) { width: 276px; }
    .demo-popup .ot-panel { flex-direction: column; }
    .demo-popup .ot-panel .ot-details { width: 276px; }
    @media (prefers-color-scheme: dark) { body { background: #242428; } }
  </style>
</head>
<body>
  <main id="popup"></main>
  <script src="popup.js" defer></script>
</body>
</html>
